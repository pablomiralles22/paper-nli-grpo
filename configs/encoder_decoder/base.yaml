num_train_epochs: 3
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4

logging_dir: "./logs"
logging_steps: 100
eval_strategy: "steps"
eval_steps: 2000
save_strategy: "steps"
save_total_limit: 1
save_steps: 2000
load_best_model_at_end: true
metric_for_best_model: eval_accuracy

bf16: true
optim: paged_adamw_8bit
max_grad_norm: 1.0
learning_rate: 5.e-5
weight_decay: 0.0
warmup_steps: 500