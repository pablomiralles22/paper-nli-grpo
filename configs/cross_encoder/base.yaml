model_id: "Qwen/Qwen2.5-7B-Instruct"
data_path: "anli"
data_name: null
train_split: "train_r3"
eval_split: "dev_r3"

run_name: ???
output_dir: "out/train/cross_encoder"
seed: 42
use_checkpoint: false

premise_column: "premise"
hypothesis_column: "hypothesis"
label_column: "label"
num_labels: 3
max_length: 1024

# Optional PEFT for sequence classification.
lora_config:
  r: 64
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules: "all-linear"

trainer_config:
  overwrite_output_dir: true
  save_total_limit: 1
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 500
  eval_steps: 500
  evaluation_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_macro_f1"
  greater_is_better: true

  num_train_epochs: 2
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1

  learning_rate: 5.e-5
  weight_decay: 0.01
  warmup_steps: 50
  max_steps: -1

  bf16: false
  fp16: true

  report_to: "none"

  model_init_kwargs:
    device_map: auto
    torch_dtype: float16
    attn_implementation: flash_attention_2
    use_cache: false

hydra:
  run:
    dir: ./out/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
