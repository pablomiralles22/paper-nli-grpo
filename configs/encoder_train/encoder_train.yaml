# Training configuration
output_dir: "./out/encoder"

num_train_epochs: 3
per_device_train_batch_size: 16
per_device_eval_batch_size: 16

logging_dir: "./logs"
logging_steps: 100
evaluation_strategy: "steps"
eval_steps: 500
save_strategy: "steps"
save_steps: 500
load_best_model_at_end: true

bf16: true
optim: adamw_8bit
max_grad_norm: 1.0
learning_rate: 3.e-5
weight_decay: 0.01
warmup_steps: 500